name: Release (legacy manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Legacy manual fallback for an existing tag; use Release (unified) for normal releases"
        required: true
        type: string

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare release inputs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          cp .goreleaser.yaml /tmp/.goreleaser.yaml
          ./scripts/release-notes "$RELEASE_TAG" > /tmp/release-notes.md
          test -s /tmp/release-notes.md
          if grep -q '^## .* - Unreleased$' /tmp/release-notes.md; then
            echo "finalize the $RELEASE_TAG changelog heading before release" >&2
            exit 1
          fi

      - name: Checkout release tag
        run: git checkout --detach "refs/tags/${RELEASE_TAG}"

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.1
          args: release --clean --config /tmp/.goreleaser.yaml --release-notes /tmp/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
