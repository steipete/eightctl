name: Release (unified)

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer to release
        required: true
        type: string
      dry_run:
        description: Build, sign and verify without creating tags or publishing
        type: boolean
        default: false

permissions: {}

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      already-published: ${{ steps.release-state.outputs.already-published }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check release metadata
        run: ./scripts/check-release-metadata

      - name: Verify existing published release
        id: release-state
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./scripts/release-preflight "$RELEASE_VERSION"

  release:
    needs: preflight
    if: inputs.dry_run || needs.preflight.outputs.already-published != 'true'
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    uses: openclaw/release-workflows/.github/workflows/release-go-cli.yml@055922501cf194ab88a686bb6d7f4ef2904440fa # v1.11.4
    with:
      version: ${{ inputs.version }}
      dry-run: ${{ inputs.dry_run }}
      repository-type: personal
      build-runner: macos
    secrets:
      MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY }}
