name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Format check (gofumpt)
        run: |
          CHANGED=$(go tool mvdan.cc/gofumpt -l .)
          if [ -n "$CHANGED" ]; then
            echo "gofumpt would reformat:" >&2
            echo "$CHANGED" >&2
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

      - name: Test with race detection
        run: go test -race ./...

      - name: Local install smoke test
        run: |
          INSTALL_ROOT=$(mktemp -d)
          trap 'rm -rf "$INSTALL_ROOT"' EXIT
          for attempt in 1 2; do
            GOFLAGS="-ldflags=-X=github.com/steipete/eightctl/internal/cmd.Version=install-proof-$attempt" \
              make install PREFIX="$INSTALL_ROOT/path with spaces/bin"
            "$INSTALL_ROOT/path with spaces/bin/eightctl" --help >/dev/null
            test "$("$INSTALL_ROOT/path with spaces/bin/eightctl" --version)" = "install-proof-$attempt"
          done

      - name: Release metadata consistency
        run: ./scripts/check-release-metadata

      - name: Release preflight regression tests
        run: ./scripts/test-release-preflight

      - name: Coverage
        run: make coverage

      - name: Release notes smoke test
        run: |
          ./scripts/release-notes v0.2.2 > /tmp/eightctl-release-notes.md
          grep -q '^## 0\.2\.2 ' /tmp/eightctl-release-notes.md
          if grep -q '^## 0\.2\.1 ' /tmp/eightctl-release-notes.md; then
            exit 1
          fi
          if ./scripts/release-notes v9.9.9 >/dev/null 2>&1; then
            exit 1
          fi

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.1
          install-only: true

      - name: Release artifact smoke test
        run: |
          goreleaser build --snapshot --clean --single-target
          BINARY=$(jq -r '.[] | select(.type == "Binary") | .path' dist/artifacts.json)
          EXPECTED=$(jq -r '.version' dist/metadata.json)
          ACTUAL=$("$BINARY" version)
          test "$ACTUAL" = "$EXPECTED"
          test "$("$BINARY" --version)" = "$EXPECTED"

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.7", "1.27.1"]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: go test ./...
