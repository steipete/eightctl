name: perm-probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe createRelease via github-script
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        continue-on-error: true
        with:
          script: |
            const cases = [
              { label: 'existing-tag+sha', tag_name: 'v0.2.1', target_commitish: '8d5b9d73c29c3e07d32171fd8208abc9e92dfb11', draft: true },
              { label: 'existing-tag-no-commitish', tag_name: 'v0.2.1', draft: true },
              { label: 'new-tag+sha', tag_name: 'perm-probe-tag3', target_commitish: '8d5b9d73c29c3e07d32171fd8208abc9e92dfb11', draft: true },
            ];
            for (const c of cases) {
              const { label, ...params } = c;
              try {
                const r = await github.rest.repos.createRelease({ ...context.repo, name: `probe ${label}`, ...params });
                core.info(`CASE ${label}: CREATED id=${r.data.id}`);
                await github.rest.repos.deleteRelease({ ...context.repo, release_id: r.data.id });
              } catch (e) { core.warning(`CASE ${label}: FAILED ${e.status} ${e.message}`); }
            }
      - name: probe via gh cli
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create perm-probe-tag2 --draft --title "perm probe 2" --notes probe --repo "$GITHUB_REPOSITORY" && echo "GH CLI: CREATED" && gh release delete perm-probe-tag2 --yes --repo "$GITHUB_REPOSITORY" || echo "GH CLI: FAILED"
