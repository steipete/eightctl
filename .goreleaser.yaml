version: 2

project_name: eightctl

changelog:
  disable: true

builds:
  - id: eightctl
    main: ./cmd/eightctl
    binary: eightctl
    ldflags:
      - -s -w -X github.com/steipete/eightctl/internal/cmd.Version={{ .Version }}
    env:
      - CGO_ENABLED=0
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64

archives:
  - ids:
      - eightctl
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt
